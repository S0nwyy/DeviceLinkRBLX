<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeviceLink</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
height:100vh;

background:
linear-gradient(135deg,#050816,#304cff);

display:flex;
align-items:center;
justify-content:center;

color:white;

}



.card{

width:90%;
max-width:420px;

background:#14182b;

padding:25px;

border-radius:35px;

text-align:center;

box-shadow:0 0 50px #000;

}



h1{

font-size:38px;

}



input{

width:100%;

height:65px;

border-radius:20px;

border:none;

outline:none;

background:#080b18;

color:white;

font-size:32px;

text-align:center;

letter-spacing:8px;

}



button{

border:none;

border-radius:25px;

height:60px;

font-size:25px;

font-weight:bold;

color:white;

background:#4d8dff;

width:100%;

margin-top:15px;

}



#memory{

font-size:35px;

margin:20px;

}



#buttons{

display:none;

grid-template-columns:1fr 1fr;

gap:15px;

}



.color{

height:90px;

font-size:40px;

}



.red{

background:#ff3b3b;

}


.blue{

background:#4080ff;

}


.green{

background:#40ff80;

}


.yellow{

background:#ffe640;

}



#status{

margin-top:20px;

font-size:20px;

}


</style>

</head>


<body>


<div class="card">


<h1>
📱 DeviceLink
</h1>


<input
id="code"
maxlength="6"
placeholder="000000"
inputmode="numeric"
>


<button onclick="connect()">
Connect
</button>



<div id="memory"></div>



<div id="buttons">

<button class="color red"
onclick="press('red')">
🔴
</button>


<button class="color blue"
onclick="press('blue')">
🔵
</button>


<button class="color green"
onclick="press('green')">
🟢
</button>


<button class="color yellow"
onclick="press('yellow')">
🟡
</button>


</div>



<div id="status">
Waiting...
</div>


</div>




<script>


const FIREBASE =
"https://devicelinkrblx-default-rtdb.firebaseio.com";



let currentCode="";

let answer=[];

let heartbeat;



function sleep(ms){

return new Promise(
r=>setTimeout(r,ms)
);

}





async function connect(){


currentCode =
document.getElementById("code").value;



let status =
document.getElementById("status");



if(currentCode.length!==6){

status.innerHTML=
"❌ Enter 6 digit code";

return;

}




let res =
await fetch(

FIREBASE+
"/connections/"+
currentCode+
".json"

);



let data =
await res.json();



if(!data){

status.innerHTML=
"❌ Invalid code";

return;

}




await fetch(

FIREBASE+
"/connections/"+
currentCode+
".json",

{

method:"PATCH",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

connected:true,

heartbeat:Date.now()

})

}

);



document.getElementById("code").style.display="none";

document.querySelector("button").style.display="none";



status.innerHTML=
"🟢 Connected";



showPattern(data.pattern);



heartbeat=setInterval(()=>{


fetch(

FIREBASE+
"/connections/"+
currentCode+
".json",

{

method:"PATCH",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

heartbeat:Date.now()

})

}

);



},5000);



}





async function showPattern(pattern){


let memory =
document.getElementById("memory");



memory.innerHTML="";



for(let color of pattern){


memory.innerHTML+=
emoji(color)+" ";


await sleep(800);


}


await sleep(500);



memory.innerHTML=
"Repeat!";



document.getElementById("buttons")
.style.display="grid";



}






function emoji(color){


return {

red:"🔴",

blue:"🔵",

green:"🟢",

yellow:"🟡"


}[color];


}






function press(color){


answer.push(color);



document.getElementById("status")
.innerHTML=
"Selected: "+
answer.length+"/4";



if(answer.length===4){

sendAnswer();

}


}







async function sendAnswer(){



await fetch(

FIREBASE+
"/connections/"+
currentCode+
".json",

{

method:"PATCH",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

answer:answer

})

}

);



document.getElementById("buttons")
.style.display="none";


document.getElementById("status")
.innerHTML=
"⌛ Checking...";



answer=[];


}



</script>


</body>

</html>
