<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeviceLink</title>


<style>

*{
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}


body{

margin:0;
height:100vh;

display:flex;
align-items:center;
justify-content:center;

background:
linear-gradient(135deg,#050816,#305cff);

color:white;

}



.card{

width:92%;
max-width:430px;

padding:30px;

background:
rgba(20,25,50,.95);

border-radius:35px;

text-align:center;

box-shadow:
0 0 50px rgba(0,0,0,.5);

}



h1{

font-size:38px;

margin:0 0 20px;

}



input{

width:100%;

height:70px;

border:none;

outline:none;

border-radius:25px;

background:#070b18;

color:white;

font-size:32px;

text-align:center;

letter-spacing:8px;

}



.mainButton{

width:100%;

height:60px;

margin-top:15px;

border:none;

border-radius:25px;

background:#4d8dff;

color:white;

font-size:22px;

font-weight:bold;

}



#pattern{

font-size:38px;

margin:25px;

}



#buttons{

display:none;

grid-template-columns:1fr 1fr;

gap:15px;

}



.color{

height:90px;

border:none;

border-radius:25px;

font-size:45px;

}



.red{

background:#ff3b3b;

}


.blue{

background:#4080ff;

}


.green{

background:#40ff80;

}


.yellow{

background:#ffe640;

}



#status{

margin-top:20px;

font-size:20px;

}



.online{

color:#40ff80;

}


</style>

</head>



<body>


<div class="card">


<h1>
📱 DeviceLink
</h1>


<input
id="code"
maxlength="6"
placeholder="000000"
inputmode="numeric"
>


<button
class="mainButton"
onclick="connect()">

Connect

</button>



<div id="pattern"></div>



<div id="buttons">


<button
class="color red"
onclick="press('red')">

🔴

</button>



<button
class="color blue"
onclick="press('blue')">

🔵

</button>



<button
class="color green"
onclick="press('green')">

🟢

</button>



<button
class="color yellow"
onclick="press('yellow')">

🟡

</button>


</div>



<div id="status">

Waiting...

</div>


</div>




<script>


const FIREBASE =
"https://devicelinkrblx-default-rtdb.firebaseio.com";



let code="";

let answer=[];

let heartbeat;



const emoji={

red:"🔴",

blue:"🔵",

green:"🟢",

yellow:"🟡"

};





async function connect(){


code =
document.getElementById("code").value;



let status =
document.getElementById("status");



if(code.length!==6){

status.innerHTML =
"❌ Enter 6 numbers";

return;

}





let request =
await fetch(

FIREBASE+
"/connections/"+
code+
".json"

);



let data =
await request.json();



if(!data){

status.innerHTML =
"❌ Invalid code";

return;

}





await fetch(

FIREBASE+
"/connections/"+
code+
".json",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

connected:true,

heartbeat:Date.now()

})

}

);




document.getElementById("code").style.display="none";

document.querySelector(".mainButton").style.display="none";



status.innerHTML =
"🟢 Connected";



showPattern(data.pattern);



heartbeat=setInterval(()=>{


fetch(

FIREBASE+
"/connections/"+
code+
".json",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

heartbeat:Date.now()

})

}

);


},5000);



}







async function showPattern(pattern){



let box =
document.getElementById("pattern");



box.innerHTML="";



for(let color of pattern){


box.innerHTML +=
emoji[color]+" ";


await new Promise(
r=>setTimeout(r,800)
);


}



await new Promise(
r=>setTimeout(r,500)
);



box.innerHTML =
"Repeat!";



document.getElementById("buttons")
.style.display="grid";


}







function press(color){


answer.push(color);



document.getElementById("status")
.innerHTML =
"Selected "+answer.length+"/4";



if(answer.length===4){

sendAnswer();

}


}







async function sendAnswer(){



await fetch(

FIREBASE+
"/connections/"+
code+
".json",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

answer:answer

})

}

);



document.getElementById("buttons")
.style.display="none";



document.getElementById("status")
.innerHTML =
"⌛ Checking...";



answer=[];


}



</script>


</body>

</html>
