<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DeviceLink</title>


<style>

*{
box-sizing:border-box;
font-family:Inter,Arial,sans-serif;
}


body{

margin:0;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:
radial-gradient(circle at top,#315cff,#050816 60%);

color:white;

overflow:hidden;

}



.card{

width:92%;

max-width:430px;

padding:30px;

border-radius:35px;

background:
rgba(20,25,50,.85);

backdrop-filter:blur(20px);

box-shadow:
0 0 60px rgba(0,0,0,.5);

text-align:center;

animation:
open .6s ease;

}



@keyframes open{

from{

opacity:0;

transform:translateY(30px) scale(.9);

}

to{

opacity:1;

transform:none;

}

}



h1{

font-size:40px;

margin:0 0 25px;

}



input{

width:100%;

height:70px;

border:none;

outline:none;

border-radius:25px;

background:#080c1c;

color:white;

font-size:32px;

text-align:center;

letter-spacing:8px;

}



button{

border:none;

cursor:pointer;

}



.connect{

width:100%;

height:60px;

margin-top:20px;

border-radius:25px;

background:#4d8dff;

color:white;

font-size:22px;

font-weight:bold;

transition:.2s;

}



.connect:active{

transform:scale(.95);

}



#pattern{

font-size:40px;

min-height:60px;

margin:25px 0;

}



#buttons{

display:none;

grid-template-columns:1fr 1fr;

gap:15px;

}



.color{

height:90px;

border-radius:25px;

font-size:45px;

transition:.15s;

}



.color:active{

transform:scale(.9);

}



.red{

background:#ff3b3b;

}


.blue{

background:#4080ff;

}


.green{

background:#40ff80;

}


.yellow{

background:#ffe640;

}



#status{

margin-top:25px;

font-size:20px;

}



.online{

color:#40ff80;

}



</style>


</head>


<body>


<div class="card">


<h1>
📱 DeviceLink
</h1>



<input
id="code"
maxlength="6"
inputmode="numeric"
placeholder="000000"
>



<button
class="connect"
onclick="connect()">

Connect Device

</button>




<div id="pattern"></div>




<div id="buttons">


<button
class="color red"
onclick="press('red')">

🔴

</button>


<button
class="color blue"
onclick="press('blue')">

🔵

</button>


<button
class="color green"
onclick="press('green')">

🟢

</button>


<button
class="color yellow"
onclick="press('yellow')">

🟡

</button>


</div>




<div id="status">

Waiting for connection...

</div>



</div>




<script>


const FIREBASE =
"https://devicelinkrblx-default-rtdb.firebaseio.com";



let code="";

let answer=[];

let heartbeat;



const emoji={

red:"🔴",

blue:"🔵",

green:"🟢",

yellow:"🟡"

};





function sleep(ms){

return new Promise(
resolve=>setTimeout(resolve,ms)
);

}







async function connect(){


code =
document.getElementById("code").value;



let status =
document.getElementById("status");



if(code.length!==6){

status.innerHTML =
"❌ Enter a 6 digit code";

return;

}





let response =
await fetch(

FIREBASE+
"/connections/"+
code+
".json"

);



let data =
await response.json();





if(!data){

status.innerHTML =
"❌ Code not found";

return;

}





await fetch(

FIREBASE+
"/connections/"+
code+
".json",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

connected:true,

heartbeat:Date.now()

})

}

);





document.getElementById("code").style.display="none";

document.querySelector(".connect").style.display="none";



status.innerHTML =
"🟢 Device Connected";



await showPattern(data.challenge);





heartbeat=setInterval(()=>{


fetch(

FIREBASE+
"/connections/"+
code+
".json",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

heartbeat:Date.now()

})

}

);



},5000);



}







async function showPattern(pattern){


let box =
document.getElementById("pattern");



box.innerHTML="";



for(let color of pattern){


box.innerHTML +=
emoji[color]+" ";


await sleep(800);


}



await sleep(500);



box.innerHTML =
"Repeat";



document.getElementById("buttons")
.style.display="grid";


}







function press(color){


answer.push(color);



document.getElementById("status")
.innerHTML =
"Selected "+answer.length+"/4";



if(answer.length===4){

sendAnswer();

}


}







async function sendAnswer(){



await fetch(

FIREBASE+
"/connections/"+
code+
".json",

{

method:"PATCH",

headers:{

"Content-Type":
"application/json"

},

body:JSON.stringify({

answer:answer

})

}

);



document.getElementById("buttons")
.style.display="none";



document.getElementById("status")
.innerHTML =
"⌛ Checking answer...";



answer=[];


}


</script>


</body>

</html>
