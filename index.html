<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DeviceLink</title>
<style>
* { box-sizing: border-box; font-family: Inter, Arial, sans-serif; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
body {
  margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 0%, #1b2a5e, #050816 65%);
  color: #fff; overflow: hidden; touch-action: none;
}
.card {
  width: 92%; max-width: 400px; padding: 36px 26px; border-radius: 28px;
  background: rgba(18,22,38,.92); border: 1px solid #2a3148;
  backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,.5);
  text-align: center; animation: open .5s ease;
}
@keyframes open { from { opacity:0; transform: translateY(20px) scale(.97);} to { opacity:1; transform:none;} }
h1 { font-size: 25px; font-weight: 700; margin: 0 0 4px; letter-spacing:.5px; }
.sub { font-size: 13px; color: #8a90a6; margin-bottom: 20px; }
input {
  width: 100%; height: 58px; border: 1px solid #2a3148; outline: none;
  border-radius: 18px; background: #0a0e1c; color: #fff; font-size: 27px;
  text-align: center; letter-spacing: 8px;
}
button { border: none; cursor: pointer; font-family: inherit; }
.connect {
  width: 100%; height: 54px; margin-top: 14px; border-radius: 18px;
  background: #4d8dff; color: #fff; font-size: 17px; font-weight: 600;
}
#status { margin-top: 16px; font-size: 15px; color: #8a90a6; min-height: 20px; }
.online { color: #40ff80; }
.spinner {
  width: 42px; height: 42px; margin: 6px auto 0;
  border: 4px solid #2a3148; border-top-color: #4d8dff;
  border-radius: 50%; animation: spin 0.9s linear infinite; display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
.check {
  width: 64px; height: 64px; margin: 6px auto 16px; border-radius: 50%;
  background: #40ff80; display: none; align-items: center; justify-content: center;
  font-size: 33px; color: #050816; animation: pop .4s ease;
}
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.hidden { display: none !important; }

#padWrap { display: none; margin-top: 6px; }
#pad {
  height: 340px; width: 96px; margin: 0 auto;
  background: #0a0e1c; border: 1px solid #2a3148; border-radius: 24px;
  position: relative; touch-action: none; overflow: hidden;
}
#paddle {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 70px; height: 70px; border-radius: 18px;
  background: linear-gradient(180deg, #6ea8ff, #4d8dff);
  box-shadow: 0 0 28px rgba(77,141,255,.65);
}
.hint { font-size: 13px; color: #8a90a6; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>DeviceLink</h1>
  <div class="sub" id="sub">Connect your phone to your session</div>

  <div id="form">
    <input id="code" maxlength="6" inputmode="numeric" placeholder="000000">
    <button class="connect" onclick="connect()">Connect Device</button>
  </div>

  <div class="spinner" id="spinner"></div>
  <div class="check" id="check">✓</div>

  <div id="padWrap">
    <div id="pad"><div id="paddle"></div></div>
    <div class="hint">Drag up / down to move your paddle</div>
  </div>

  <div id="status">Waiting for connection...</div>
</div>

<script>
const FIREBASE = "https://devicelinkrblx-default-rtdb.firebaseio.com";
let code = "", linked = false, padVal = 0.5, dragging = false;
const $ = id => document.getElementById(id);
const setStatus = t => $("status").innerHTML = t;

async function connect() {
  code = $("code").value.trim();
  if (code.length !== 6) { setStatus("❌ Enter a 6 digit code"); return; }

  let data;
  try { data = await (await fetch(FIREBASE + "/connections/" + code + ".json")).json(); }
  catch (e) { setStatus("❌ Connection error"); return; }
  if (!data) { setStatus("❌ Code not found or expired"); return; }

  $("form").classList.add("hidden");
  $("spinner").style.display = "block";
  setStatus("Connecting…");

  await fetch(FIREBASE + "/connections/" + code + ".json", {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ connected: true })
  });

  setTimeout(async () => {
    await fetch(FIREBASE + "/connections/" + code + ".json", {
      method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ verified: true, paddleY: padVal })
    });
    setTimeout(showController, 700);
  }, 700);
}

function showController() {
  $("spinner").style.display = "none";
  $("check").style.display = "flex";
  $("sub").innerText = "Device linked";
  $("status").innerHTML = "Sit down at the table to play";
  $("status").classList.add("online");
  linked = true;
  $("padWrap").style.display = "block";
  setupPad();
  // Keep pushing the paddle position so the game always has the latest value
  setInterval(() => {
    if (linked) {
      fetch(FIREBASE + "/connections/" + code + ".json", {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paddleY: padVal })
      });
    }
  }, 60);
}

function setupPad() {
  const pad = $("pad"), paddle = $("paddle");

  function apply(clientY) {
    const r = pad.getBoundingClientRect();
    let v = (clientY - r.top) / r.height;
    padVal = Math.min(1, Math.max(0, v));
    paddle.style.top = (padVal * 100) + "%";
  }

  const start = e => {
    dragging = true;
    apply((e.touches ? e.touches[0] : e).clientY);
    e.preventDefault();
  };
  const move = e => {
    if (!dragging) return;
    apply((e.touches ? e.touches[0] : e).clientY);
    e.preventDefault();
  };
  const end = () => { dragging = false; };

  pad.addEventListener("touchstart", start, { passive: false });
  pad.addEventListener("touchmove", move, { passive: false });
  pad.addEventListener("touchend", end);
  pad.addEventListener("mousedown", start);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
}

window.addEventListener("load", () => {
  const c = new URLSearchParams(location.search).get("code");
  if (c && c.length === 6) { $("code").value = c; connect(); }
});
</script>
</body>
</html>
